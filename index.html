<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniScheduler Pro | Live Sync</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .cancelled-class { background-color: #fee2e2 !important; color: #991b1b !important; position: relative; }
        .cancelled-class::before { content: 'CANCELLED'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); font-weight: 900; font-size: 0.6rem; opacity: 0.2; letter-spacing: 2px; }
        .active-slot { border: 2px solid #6366f1; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="App.route('gatekeeper')">
                <div class="w-8 h-8 bg-indigo-500 rounded flex items-center justify-center font-bold text-white">U</div>
                <h1 class="font-bold tracking-tight hidden sm:block italic">UniScheduler</h1>
            </div>
            <div id="header-college-info" class="hidden flex items-center gap-4">
                <div class="text-right leading-tight">
                    <div id="clock-display" class="font-mono text-lg font-bold text-indigo-400">00:00</div>
                    <div id="active-college-tag" class="text-[10px] bg-indigo-900 px-2 py-0.5 rounded text-indigo-200 uppercase tracking-widest font-bold">COLLEGE</div>
                </div>
                <button onclick="Actions.logout()" class="p-2 bg-slate-800 rounded-lg hover:bg-red-900 transition text-xs font-bold">EXIT</button>
            </div>
        </div>
    </header>

    <main id="app" class="flex-grow container mx-auto px-4 py-6 fade-in"></main>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBazqqix_N0RwF35G1DjVkRgp3MV_QIstQ",
            authDomain: "attendance-sys-2812.firebaseapp.com",
            databaseURL: "https://attendance-sys-2812-default-rtdb.firebaseio.com",
            projectId: "attendance-sys-2812",
            storageBucket: "attendance-sys-2812.firebasestorage.app",
            messagingSenderId: "741925411402",
            appId: "1:741925411402:web:7a98b911ce5f57498c24b3"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const CONFIG = {
            days: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'],
            slots: ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00']
        };

        // --- 2. DATABASE HANDLER ---
        const DB = {
            sync: (name) => {
                database.ref('colleges/' + name).on('value', (snap) => {
                    App.collegeData = snap.val() || {};
                    App.render();
                });
            },
            update: (path, val) => {
                return database.ref(`colleges/${App.college}/${path}`).set(val);
            }
        };

        const Time = {
            getCurrent: () => {
                const now = new Date();
                return { 
                    day: now.toLocaleDateString('en-US', { weekday: 'long' }), 
                    time: now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }),
                    dayIndex: now.getDay() - 1 
                };
            },
            getStatus: (slotDay, slotTime) => {
                const now = Time.getCurrent();
                const slotDayIdx = CONFIG.days.indexOf(slotDay);
                if (now.dayIndex < 0 || now.dayIndex > 4) return 'future';
                if (slotDayIdx < now.dayIndex) return 'past';
                if (slotDayIdx > now.dayIndex) return 'future';
                return (slotTime < now.time) ? 'past' : (slotTime === now.time ? 'active' : 'future');
            }
        };

        // --- 3. APP CORE ---
        const App = {
            college: localStorage.getItem('active_college'),
            collegeData: null,
            view: 'gatekeeper',
            user: JSON.parse(localStorage.getItem('active_user') || 'null'),

            init: () => {
                if(App.college) {
                    App.view = 'home';
                    DB.sync(App.college);
                }
                setInterval(() => {
                    const clock = document.getElementById('clock-display');
                    if(clock) clock.innerText = Time.getCurrent().time;
                }, 1000);
                App.render();
            },

            route: (v) => { App.view = v; App.render(); },

            render: () => {
                const container = document.getElementById('app');
                const headerInfo = document.getElementById('header-college-info');
                
                if (App.college) {
                    headerInfo.classList.remove('hidden');
                    document.getElementById('active-college-tag').innerText = App.college;
                }

                if(App.view !== 'gatekeeper' && !App.collegeData) {
                    container.innerHTML = `<div class="p-20 text-center text-slate-400">Connecting to Cloud...</div>`;
                    return;
                }

                switch(App.view) {
                    case 'gatekeeper': container.innerHTML = Views.gatekeeper(); break;
                    case 'home': container.innerHTML = Views.home(); break;
                    case 'admin': container.innerHTML = Views.admin(App.collegeData); break;
                    case 'teacher': container.innerHTML = Views.teacher(App.collegeData); break;
                    case 'student': container.innerHTML = Views.student(App.collegeData); break;
                }
            }
        };

        // --- 4. VIEWS ---
        const Views = {
            gatekeeper: () => `
                <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl mt-10">
                    <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">College Portal</h2>
                    <input id="join-name" type="text" placeholder="College Name" class="w-full border p-3 rounded-lg mb-4">
                    <button onclick="Actions.enterCollege()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold">Enter</button>
                    <div class="text-center py-4 text-xs text-slate-400 uppercase font-bold">Or</div>
                    <button onclick="Actions.registerCollege()" class="w-full border-2 border-indigo-600 text-indigo-600 py-3 rounded-lg font-bold">Register New</button>
                </div>`,

            home: () => `
                <div class="max-w-4xl mx-auto grid md:grid-cols-3 gap-6 mt-10">
                    <div onclick="Actions.loginRole('admin')" class="bg-white p-8 rounded-2xl shadow hover:ring-2 ring-indigo-500 cursor-pointer transition">
                        <div class="text-4xl mb-4">🛠️</div><h2 class="text-xl font-bold">Administrator</h2>
                    </div>
                    <div onclick="Actions.loginRole('teacher')" class="bg-white p-8 rounded-2xl shadow hover:ring-2 ring-indigo-500 cursor-pointer transition">
                        <div class="text-4xl mb-4">👨‍🏫</div><h2 class="text-xl font-bold">Teacher</h2>
                    </div>
                    <div onclick="Actions.loginRole('student')" class="bg-white p-8 rounded-2xl shadow hover:ring-2 ring-indigo-500 cursor-pointer transition">
                        <div class="text-4xl mb-4">🎒</div><h2 class="text-xl font-bold">Student</h2>
                    </div>
                </div>`,

            admin: (data) => `
                <div class="max-w-6xl mx-auto">
                    <div class="flex justify-between mb-6">
                        <h2 class="text-2xl font-bold">Editor: ${App.college}</h2>
                        <button onclick="App.route('home')" class="text-indigo-600 font-bold">Exit</button>
                    </div>
                    <div class="grid md:grid-cols-4 gap-6">
                        <div class="bg-white p-4 rounded-xl shadow h-fit">
                            <h3 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">Sections</h3>
                            ${(data.sections || []).map(s => `
                                <div onclick="App.activeSection='${s.id}'; App.render()" class="p-3 mb-2 rounded border cursor-pointer transition ${App.activeSection === s.id ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'hover:bg-slate-50'}">
                                    <div class="text-[10px] font-bold opacity-50">${s.year}</div>
                                    <div class="font-bold">${s.name}</div>
                                </div>
                            `).join('')}
                            <button onclick="Actions.addSection()" class="w-full border-2 border-dashed p-2 mt-2 text-slate-400 rounded hover:text-indigo-600 transition">+ Add Section</button>
                        </div>
                        <div class="md:col-span-3 bg-white rounded-xl shadow overflow-x-auto p-4">
                            ${App.activeSection ? Views.editorTable(data, App.activeSection) : '<div class="p-20 text-center text-slate-300 italic">Select a section to edit its schedule</div>'}
                        </div>
                    </div>
                </div>`,

            editorTable: (data, secId) => `
                <table class="w-full text-sm">
                    <thead><tr><th class="p-2 text-left text-slate-400 uppercase text-[10px]">Day</th>${CONFIG.slots.map(s=>`<th class="p-2 text-slate-400 text-[10px] uppercase font-black">${s}</th>`).join('')}</tr></thead>
                    <tbody>
                        ${CONFIG.days.map(day => `
                            <tr class="border-t border-slate-50">
                                <td class="font-bold p-3 text-slate-400 bg-slate-50/50">${day.substring(0,3)}</td>
                                ${CONFIG.slots.map(slot => {
                                    const id = `${secId}-${day}-${slot}`.replace(/\s+/g, '_');
                                    const cell = (data.schedule && data.schedule[id]) || {subject:'', teacher:''};
                                    return `<td class="p-2 border-l border-slate-50">
                                        <input class="w-full font-bold focus:text-indigo-600 outline-none" value="${cell.subject}" onchange="Actions.updateCell('${id}','subject',this.value)" placeholder="Subject">
                                        <input class="w-full text-[10px] text-slate-400 outline-none" value="${cell.teacher}" onchange="Actions.updateCell('${id}','teacher',this.value)" placeholder="Teacher">
                                    </td>`;
                                }).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`,

            teacher: (data) => `
                <div class="max-w-4xl mx-auto">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">Teacher Portal: ${App.user.name}</h2>
                        <button onclick="App.route('home')" class="text-slate-400">Logout</button>
                    </div>
                    <div class="bg-white rounded-xl shadow overflow-hidden border">
                        <div class="grid grid-cols-6 text-center bg-slate-50 border-b">
                            <div class="p-4 font-black text-slate-400 text-[10px]">TIME</div>
                            ${CONFIG.days.map(d=>`<div class="p-4 font-bold text-slate-700">${d.substring(0,3)}</div>`).join('')}
                        </div>
                        ${CONFIG.slots.map(slot => `
                            <div class="grid grid-cols-6 border-b last:border-0 min-h-[80px]">
                                <div class="p-4 bg-slate-50/50 text-slate-400 text-xs font-bold flex items-center justify-center">${slot}</div>
                                ${CONFIG.days.map(day => {
                                    let matchId = null, matchData = null;
                                    Object.keys(data.schedule || {}).forEach(k => {
                                        if(data.schedule[k].teacher === App.user.name && k.includes(`${day}-${slot}`)) { matchId = k; matchData = data.schedule[k]; }
                                    });
                                    if(!matchId) return `<div class="border-l border-slate-50"></div>`;
                                    const isC = data.cancelled && data.cancelled[matchId];
                                    return `<div class="p-2 border-l border-slate-50 cursor-pointer transition hover:bg-slate-50 ${isC?'cancelled-class':''}" 
                                                 onmousedown="Interaction.start('${matchId}')" onmouseup="Interaction.end('${matchId}')">
                                            <div class="text-[10px] font-bold text-indigo-500">${matchId.split('-')[0]}</div>
                                            <div class="font-bold text-sm">${matchData.subject}</div>
                                        </div>`;
                                }).join('')}
                            </div>
                        `).join('')}
                    </div>
                </div>`,

            student: (data) => {
                const sKey = `S-${App.user.sectionId}-${App.user.roll}`.replace(/\s+/g, '_');
                return `
                <div class="max-w-6xl mx-auto">
                    <div class="bg-indigo-600 text-white p-8 rounded-3xl shadow-xl mb-8 flex justify-between items-center relative overflow-hidden">
                        <div class="z-10">
                            <h2 class="text-3xl font-black mb-1">Student Dashboard</h2>
                            <p class="opacity-75 font-medium tracking-wide uppercase text-sm">${App.user.sectionId} • Roll No: ${App.user.roll}</p>
                        </div>
                        <button onclick="App.route('home')" class="z-10 bg-white/20 backdrop-blur-md px-6 py-2 rounded-xl font-bold hover:bg-white/30 transition">Switch User</button>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="p-6 font-black text-slate-400 text-[10px] uppercase w-32 tracking-widest">Time Slot</th>
                                        ${CONFIG.days.map(d=>`<th class="p-6 font-bold text-slate-800 text-center border-l border-slate-100">${d}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${CONFIG.slots.map(slot => `
                                        <tr class="border-t border-slate-100">
                                            <td class="p-6 font-mono text-sm text-slate-400 bg-slate-50/30 font-bold">${slot}</td>
                                            ${CONFIG.days.map(day => {
                                                const id = `${App.user.sectionId}-${day}-${slot}`.replace(/\s+/g, '_');
                                                const cell = data.schedule && data.schedule[id];
                                                if(!cell || !cell.subject) return `<td class="p-2 border-l border-slate-50"></td>`;
                                                
                                                const isC = data.cancelled && data.cancelled[id];
                                                const isA = data.attendance && data.attendance[sKey] && data.attendance[sKey][id];
                                                const status = Time.getStatus(day, slot);

                                                return `<td class="p-3 border-l border-slate-100 min-w-[160px]">
                                                    <div onclick="Actions.markAtt('${sKey}','${id}')" 
                                                         class="p-4 rounded-2xl border-2 transition-all cursor-pointer relative overflow-hidden group
                                                         ${isC ? 'cancelled-class border-red-100' : ''} 
                                                         ${isA ? 'bg-green-50 border-green-500' : 'bg-white border-slate-50 hover:border-indigo-200'}
                                                         ${status === 'active' && !isA ? 'active-slot bg-indigo-50 border-indigo-500' : ''}">
                                                        
                                                        <div class="text-[10px] font-black uppercase mb-2 ${isA ? 'text-green-600' : 'text-indigo-500'}">
                                                            ${isA ? '✓ ATTENDED' : (isC ? 'Class Cancelled' : status)}
                                                        </div>
                                                        <div class="font-black text-slate-800 text-lg leading-tight group-hover:text-indigo-600 transition">${cell.subject}</div>
                                                        <div class="text-xs text-slate-400 font-medium mt-1">${cell.teacher}</div>
                                                        
                                                        ${isA ? '<div class="absolute -right-2 -bottom-2 text-4xl opacity-10 font-black text-green-600 italic">DONE</div>' : ''}
                                                    </div>
                                                </td>`;
                                            }).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }
        };

        // --- 5. ACTIONS ---
        const Actions = {
            enterCollege: () => {
                const name = document.getElementById('join-name').value;
                if(!name) return;
                database.ref('colleges/' + name).once('value', s => {
                    if(s.exists()) {
                        App.college = name;
                        localStorage.setItem('active_college', name);
                        DB.sync(name);
                        App.route('home');
                    } else alert("College not found.");
                });
            },
            registerCollege: () => {
                const n = prompt("New College Name:"); if(!n) return;
                const p = prompt("Admin Password:");
                database.ref('colleges/'+n).set({ password: p, sections: [{id:'Year-1-A', year:'Year 1', name:'A'}], schedule:{} }).then(()=>alert("Success!"));
            },
            logout: () => { localStorage.clear(); location.reload(); },
            loginRole: (role) => {
                if(role === 'admin') {
                    if(prompt("Password:") === App.collegeData.password) App.route('admin');
                } else if(role === 'teacher') {
                    const n = prompt("Your Name (as entered in schedule):"); if(n) { App.user = {name: n}; App.route('teacher'); }
                } else if(role === 'student') {
                    const yr = prompt("Year (e.g., Year 1):");
                    const sec = prompt("Section (e.g., A):");
                    const roll = prompt("Roll No:");
                    if(yr && sec && roll) {
                        App.user = { sectionId: `${yr}-${sec}`, roll: roll };
                        localStorage.setItem('active_user', JSON.stringify(App.user));
                        App.route('student');
                    }
                }
            },
            markAtt: (sKey, id) => {
                const status = App.collegeData.attendance?.[sKey]?.[id];
                DB.update(`attendance/${sKey}/${id}`, !status);
            },
            updateCell: (id, f, v) => DB.update(`schedule/${id}/${f}`, v),
            addSection: () => {
                const y = prompt("Year:"); const n = prompt("Section Name:");
                if(y && n) {
                    const sects = App.collegeData.sections || [];
                    sects.push({id: `${y}-${n}`, year: y, name: n});
                    DB.update('sections', sects);
                }
            }
        };

        const Interaction = {
            timer: null,
            long: false,
            start: (id) => {
                Interaction.long = false;
                Interaction.timer = setTimeout(() => {
                    Interaction.long = true;
                    const note = prompt("Add class note:"); if(note !== null) DB.update(`notes/${id}`, note);
                }, 700);
            },
            end: (id) => {
                clearTimeout(Interaction.timer);
                if(!Interaction.long) {
                    const isC = App.collegeData.cancelled?.[id];
                    DB.update(`cancelled/${id}`, !isC);
                }
            }
        };

        App.init();
    </script>
</body>
</html>
