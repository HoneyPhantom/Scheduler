<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniScheduler Pro | Integrated Academic Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; scroll-behavior: smooth; }
        .cancelled-class { background-color: #fee2e2 !important; color: #991b1b !important; position: relative; opacity: 0.7; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        input, textarea, select { outline: none !important; }
        .next-class-pulse { animation: pulse-indigo 2s infinite; }
        @keyframes pulse-indigo { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        .hero-gradient { background: radial-gradient(circle at top right, #eef2ff 0%, #f8fafc 50%); }
    </style>
</head>
<body class="hero-gradient">

    <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="Actions.goBack()">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <span class="text-white font-black">U</span>
                </div>
                <h1 class="text-xl font-extrabold tracking-tighter">UniScheduler <span class="text-indigo-600">Pro</span></h1>
            </div>
            <div id="nav-meta" class="hidden flex items-center gap-6">
                <div id="clock-display" class="font-bold text-sm hidden sm:block text-slate-400">00:00:00</div>
                <button onclick="Actions.goBack()" class="flex items-center gap-2 bg-slate-100 hover:bg-red-50 text-slate-500 hover:text-red-600 px-4 py-2 rounded-xl transition-all font-bold text-xs uppercase tracking-wider">
                    <span>Back</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main id="app" class="max-w-7xl mx-auto p-6"></main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBazqqix_N0RwF35G1DjVkRgp3MV_QIstQ",
            authDomain: "attendance-sys-2812.firebaseapp.com",
            databaseURL: "https://attendance-sys-2812-default-rtdb.firebaseio.com",
            projectId: "attendance-sys-2812",
            storageBucket: "attendance-sys-2812.firebasestorage.app",
            messagingSenderId: "741925411402",
            appId: "1:741925411402:web:7a98b911ce5f57498c24b3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CONFIG = {
            days: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'],
            slots: ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00']
        };

        const App = {
            college: localStorage.getItem('active_college'),
            collegeData: null,
            view: localStorage.getItem('active_college') ? 'home' : 'landing',
            user: JSON.parse(localStorage.getItem('active_user') || 'null'),
            activeSection: null,

            init() {
                if(this.college) { this.sync(); }
                setInterval(() => {
                    const el = document.getElementById('clock-display');
                    if(el) el.innerText = new Date().toLocaleTimeString();
                }, 1000);
                this.render();
            },

            sync() {
                db.ref('colleges/' + this.college).on('value', snap => {
                    this.collegeData = snap.val() || {};
                    this.render();
                });
            },

            route(v) { this.view = v; this.render(); },

            render() {
                const root = document.getElementById('app');
                const nav = document.getElementById('nav-meta');
                
                // Nav visibility logic
                if(this.view === 'landing') nav.classList.add('hidden');
                else nav.classList.remove('hidden');

                if(this.view === 'landing') { root.innerHTML = Views.landing(); return; }
                if(this.view === 'gatekeeper') { root.innerHTML = Views.gatekeeper(); return; }
                
                if(!this.collegeData && this.view !== 'landing') { 
                    root.innerHTML = '<div class="mt-20 text-center animate-pulse text-slate-400 font-bold">Connecting to Institution...</div>'; 
                    return; 
                }
                
                switch(this.view) {
                    case 'home': root.innerHTML = Views.home(); break;
                    case 'admin': root.innerHTML = Views.admin(); break;
                    case 'teacher': root.innerHTML = Views.teacher(); break;
                    case 'student': root.innerHTML = Views.student(); break;
                }
            }
        };

        const Utils = {
            getNextClass() {
                const now = new Date();
                const currentDay = CONFIG.days[now.getDay() - 1];
                if (!currentDay) return null;
                const currentHour = now.getHours();
                const sectionId = App.user.sectionId;

                for (let slot of CONFIG.slots) {
                    const slotHour = parseInt(slot.split(':')[0]);
                    if (slotHour > currentHour) {
                        const id = `${sectionId}-${currentDay}-${slot}`.replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
                        const classData = App.collegeData.schedule ? App.collegeData.schedule[id] : null;
                        if (classData && classData.subject) return { ...classData, time: slot };
                    }
                }
                return null;
            }
        };

        const Views = {
            landing: () => `
                <div class="min-h-[85vh] flex flex-col items-center justify-center text-center px-4 py-12">
                    <div class="mb-6 inline-flex items-center gap-2 bg-indigo-50 text-indigo-600 px-4 py-2 rounded-full text-[10px] font-black tracking-widest uppercase">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-600"></span>
                        </span>
                        Live Academic Network
                    </div>
                    
                    <h1 class="text-5xl md:text-7xl font-black tracking-tighter mb-6 leading-tight max-w-4xl">
                        Your campus, <br/>
                        <span class="text-indigo-600">synchronized.</span>
                    </h1>
                    
                    <p class="text-slate-500 text-lg md:text-xl max-w-2xl mb-12 font-medium">
                        The ultimate scheduler for modern institutions. Track attendance, broadcast updates, and manage faculty timelines in one unified workspace.
                    </p>

                    <div class="flex flex-col sm:flex-row gap-4 mb-24 w-full justify-center">
                        <button onclick="App.route('gatekeeper')" class="bg-indigo-600 text-white px-10 py-5 rounded-2xl font-black shadow-xl shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-1 transition-all text-lg">
                            Enter Portal
                        </button>
                        <button onclick="window.scrollTo(0, 1000)" class="bg-white border-2 border-slate-100 text-slate-600 px-10 py-5 rounded-2xl font-black hover:bg-slate-50 transition-all text-lg">
                            Learn More
                        </button>
                    </div>

                    <div class="grid md:grid-cols-3 gap-8 max-w-6xl w-full">
                        ${Views.featCard('⚡', 'Live Schedules', 'Instant synchronization for class cancellations and room shifts.')}
                        ${Views.featCard('📊', 'Smart Attendance', 'Automated student presence tracking with visual progress reports.')}
                        ${Views.featCard('🔒', 'Role Security', 'Dedicated, password-protected dashboards for Admin, Teachers, and Students.')}
                    </div>
                </div>`,

            featCard: (icon, title, desc) => `
                <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm text-left hover:shadow-md transition-shadow">
                    <div class="text-3xl mb-4">${icon}</div>
                    <h4 class="font-black text-xl mb-2">${title}</h4>
                    <p class="text-slate-400 text-sm font-medium leading-relaxed">${desc}</p>
                </div>`,

            gatekeeper: () => `
                <div class="max-w-md mx-auto mt-20 bg-white p-10 rounded-3xl shadow-2xl border border-slate-100">
                    <h2 class="text-3xl font-black mb-2 text-indigo-600">Institution Login</h2>
                    <p class="text-slate-500 mb-8 font-medium text-sm italic">Enter institutional name to connect.</p>
                    <input id="c-input" type="text" placeholder="College Name" class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl mb-4 focus:border-indigo-500 transition-all font-bold">
                    <button onclick="Actions.enter()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">CONNECT</button>
                    <div class="relative my-8"><div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-100"></span></div><div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400 font-bold">Administration</span></div></div>
                    <button onclick="Actions.registerCollege()" class="w-full border-2 border-slate-100 text-slate-600 py-3 rounded-2xl font-bold hover:bg-slate-50 transition-all">REGISTER NEW COLLEGE</button>
                </div>`,

            home: () => `
                <div class="grid md:grid-cols-3 gap-8 mt-12 max-w-5xl mx-auto">
                    ${Views.roleCard('Admin', '🛠️', 'Master Control', 'admin')}
                    ${Views.roleCard('Teacher', '👨‍🏫', 'Class Updates', 'teacher_login')}
                    ${Views.roleCard('Student', '🎓', 'Personal Portal', 'student_login')}
                </div>`,

            roleCard: (title, icon, sub, role) => `
                <div onclick="Actions.handleRole('${role}')" class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-xl hover:shadow-2xl transition-all cursor-pointer text-center group">
                    <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">${icon}</div>
                    <h3 class="text-xl font-black">${title}</h3>
                    <p class="text-slate-400 font-bold text-[10px] mt-1 uppercase tracking-widest">${sub}</p>
                </div>`,

            teacher: () => `
                <div class="max-w-7xl mx-auto">
                    <h2 class="text-3xl font-black mb-8">Welcome, Prof. ${App.user.name}</h2>
                    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="p-4 text-[10px] font-black text-slate-400 uppercase">Day</th>
                                        ${CONFIG.slots.map(s => `<th class="p-4 text-[10px] font-black text-slate-400 uppercase border-l">${s}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${CONFIG.days.map(day => `
                                        <tr class="border-t">
                                            <td class="p-4 font-black text-indigo-600 bg-slate-50/50">${day}</td>
                                            ${CONFIG.slots.map(slot => {
                                                let matchId = null; let matchData = null;
                                                Object.keys(App.collegeData.schedule || {}).forEach(k => {
                                                    if(App.collegeData.schedule[k].teacher === App.user.name && k.includes(`${day}-${slot}`)) {
                                                        matchId = k; matchData = App.collegeData.schedule[k];
                                                    }
                                                });
                                                if(!matchId) return `<td class="p-4 border-l bg-slate-50/10"></td>`;
                                                const isC = App.collegeData.cancelled && App.collegeData.cancelled[matchId];
                                                return `
                                                <td class="p-3 border-l min-w-[180px] ${isC ? 'cancelled-class' : ''}">
                                                    <div onclick="Actions.toggleCancel('${matchId}')" class="cursor-pointer mb-2">
                                                        <div class="text-[9px] font-black text-indigo-400 uppercase">${matchId.split('-')[0]}</div>
                                                        <div class="font-bold text-xs">${matchData.subject}</div>
                                                    </div>
                                                    <textarea onchange="Actions.updateCell('${matchId}', 'note', this.value)" placeholder="Add note..." class="w-full p-2 text-[10px] bg-slate-100 rounded-lg h-12 resize-none">${matchData.note || ''}</textarea>
                                                </td>`;
                                            }).join('')}
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`,

            student: () => {
                const currentDay = CONFIG.days[new Date().getDay() - 1] || 'Monday';
                const currentSecId = App.user.sectionId; 
                const studentKey = `${currentSecId}_${App.user.roll}`.replace(/\s+/g, '_');
                const myAttendance = App.collegeData.attendance ? (App.collegeData.attendance[studentKey] || {}) : {};
                const nextClass = Utils.getNextClass();
                
                const presentCount = Object.values(myAttendance).filter(v => v === true).length;
                const totalScheduled = Object.keys(App.collegeData.schedule || {}).filter(k => k.startsWith(currentSecId) && App.collegeData.schedule[k].subject).length;
                const percentage = totalScheduled > 0 ? Math.round((presentCount / totalScheduled) * 100) : 0;

                return `
                <div class="max-w-7xl mx-auto">
                    ${nextClass ? `
                    <div class="mb-8 bg-indigo-600 rounded-[2.5rem] p-6 text-white flex flex-col md:flex-row items-center justify-between gap-4 next-class-pulse">
                        <div class="flex items-center gap-4">
                            <div class="bg-white/20 p-3 rounded-2xl text-2xl">📢</div>
                            <div>
                                <div class="text-[10px] font-black uppercase opacity-60">Next: ${nextClass.time}</div>
                                <div class="text-xl font-bold">${nextClass.subject}</div>
                            </div>
                        </div>
                        <div class="bg-white/10 px-6 py-3 rounded-2xl border border-white/10 italic text-sm">
                            Note: ${nextClass.note || 'No special instructions.'}
                        </div>
                    </div>` : ''}

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
                            <div class="text-[10px] font-black text-slate-400 uppercase">Profile</div>
                            <div class="text-xl font-black">${App.user.roll} <span class="text-indigo-600 text-xs">(${App.user.section})</span></div>
                        </div>
                        <div class="bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
                            <div class="text-[10px] font-black text-slate-400 uppercase">Presence</div>
                            <div class="text-2xl font-black">${presentCount} / ${totalScheduled}</div>
                        </div>
                        <div class="${percentage < 75 ? 'bg-orange-500' : 'bg-emerald-500'} p-6 rounded-[2.5rem] text-white shadow-lg">
                            <div class="text-[10px] font-black opacity-70 uppercase">Progress</div>
                            <div class="text-3xl font-black">${percentage}%</div>
                        </div>
                    </div>

                    <div class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-900 text-white">
                                    <tr>
                                        <th class="p-6 text-[10px] font-black uppercase">Weekly</th>
                                        ${CONFIG.slots.map(s => `<th class="p-6 text-[10px] font-black uppercase border-l border-white/10">${s}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${CONFIG.days.map(day => `
                                        <tr class="border-b last:border-0 ${day === currentDay ? 'bg-indigo-50/30' : ''}">
                                            <td class="p-6 font-black text-slate-400 text-xs border-r">${day}</td>
                                            ${CONFIG.slots.map(slot => {
                                                const id = `${currentSecId}-${day}-${slot}`.replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
                                                const cell = App.collegeData.schedule && App.collegeData.schedule[id];
                                                const isC = App.collegeData.cancelled && App.collegeData.cancelled[id];
                                                const isPresent = myAttendance[id];
                                                if(!cell || !cell.subject) return `<td class="p-2 border-l border-slate-50"></td>`;
                                                return `
                                                <td class="p-2 border-l border-slate-100 min-w-[200px]">
                                                    <div onclick="Actions.toggleAttendance('${studentKey}', '${id}')" class="p-4 rounded-[1.5rem] transition-all cursor-pointer ${isC ? 'cancelled-class' : (isPresent ? 'bg-emerald-50 border-2 border-emerald-500 shadow-sm' : 'bg-white border-2 border-transparent hover:border-slate-100')}">
                                                        <div class="font-black text-slate-800 text-sm mb-1">${cell.subject}</div>
                                                        <div class="text-[10px] text-slate-400 font-bold mb-2">${cell.teacher}</div>
                                                        ${cell.note ? `<div class="text-[9px] text-indigo-500 italic bg-indigo-50 p-1 rounded">Note: ${cell.note}</div>` : ''}
                                                    </div>
                                                </td>`;
                                            }).join('')}
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            },

            admin: () => `
                <div class="flex flex-col lg:flex-row gap-8">
                    <div class="w-full lg:w-72 shrink-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black">Sections</h2>
                            <button onclick="Actions.addSection()" class="bg-indigo-600 text-white w-8 h-8 rounded-lg font-black">+</button>
                        </div>
                        <div class="space-y-3">
                            ${(App.collegeData.sections || []).map(s => `
                                <div onclick="App.activeSection='${s.id}'; App.render()" class="p-4 rounded-2xl border-2 transition-all cursor-pointer ${App.activeSection === s.id ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg' : 'bg-white border-transparent hover:border-slate-200'}">
                                    <div class="font-bold">${s.name} <span class="text-[10px] opacity-60">(${s.year})</span></div>
                                </div>`).join('')}
                        </div>
                    </div>
                    <div class="grow bg-white rounded-3xl shadow-xl border border-slate-100 p-6 overflow-hidden">
                        ${App.activeSection ? Views.editorTable() : `<div class="p-20 text-center text-slate-300 italic">Select a section to begin configuring the timetable.</div>`}
                    </div>
                </div>`,

            editorTable: () => `
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead><tr><th></th>${CONFIG.slots.map(s => `<th class="p-2 text-[10px] font-black text-slate-400 uppercase">${s}</th>`).join('')}</tr></thead>
                        <tbody>
                            ${CONFIG.days.map(day => `
                                <tr class="border-t">
                                    <td class="p-3 font-black text-xs text-slate-400 border-r">${day.slice(0,3)}</td>
                                    ${CONFIG.slots.map(slot => {
                                        const id = `${App.activeSection}-${day}-${slot}`.replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
                                        const cell = (App.collegeData.schedule && App.collegeData.schedule[id]) || {subject:'', teacher:'', note:''};
                                        return `<td>
                                            <div class="bg-slate-50 p-2 m-1 rounded-xl min-w-[140px]">
                                                <input onchange="Actions.updateCell('${id}', 'subject', this.value)" value="${cell.subject}" placeholder="Subject" class="w-full bg-transparent text-xs font-bold">
                                                <input onchange="Actions.updateCell('${id}', 'teacher', this.value)" value="${cell.teacher}" placeholder="Professor" class="w-full bg-transparent text-[9px] text-slate-400">
                                            </div>
                                        </td>`;
                                    }).join('')}
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`
        };

        const Actions = {
            goBack() {
                if (['admin', 'teacher', 'student'].includes(App.view)) App.route('home');
                else if (App.view === 'home') { localStorage.removeItem('active_college'); App.college = null; App.route('gatekeeper'); }
                else if (App.view === 'gatekeeper') App.route('landing');
                else location.reload();
            },
            enter() {
                const n = document.getElementById('c-input').value;
                if(!n) return;
                db.ref('colleges/' + n).once('value', s => {
                    if(s.exists()) { App.college = n; localStorage.setItem('active_college', n); App.sync(); App.route('home'); }
                    else alert("College not found. Please register first.");
                });
            },
            registerCollege() {
                const n = prompt("Unique Institution Name:"), p = prompt("Set Admin Password:");
                if(n && p) {
                    db.ref('colleges/'+n).set({ password: p, sections: [], schedule: {} }).then(() => alert("Institution Registered Successfully!"));
                }
            },
            handleRole(role) {
                if(role === 'admin') { if(prompt("Enter Admin Access Key: (i.e Your college password)") === App.collegeData.password) App.route('admin'); }
                else if (role === 'teacher_login') this.secureUserLogin('teacher_login');
                else if (role === 'student_login') this.showStudentSectionFirst();
            },
            showStudentSectionFirst() {
                const years = [...new Set((App.collegeData.sections || []).map(s => s.year))];
                if(years.length === 0) { alert("Admin hasn't created sections yet."); return; }
                const modal = `
                    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur z-[100] flex items-center justify-center p-4">
                        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl">
                            <h3 class="text-xl font-black mb-6">Class Identity</h3>
                            <select id="s-year" class="w-full bg-slate-50 border-2 p-4 rounded-xl font-bold mb-4" onchange="Actions.filterSecs()"><option value="">Select Year</option>${years.map(y => `<option value="${y}">${y}</option>`).join('')}</select>
                            <select id="s-sec" class="w-full bg-slate-50 border-2 p-4 rounded-xl font-bold mb-6"><option value="">Select Section</option></select>
                            <button onclick="Actions.proceedToStudentLogin()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">NEXT</button>
                            <button onclick="document.getElementById('modal').remove()" class="w-full text-slate-400 mt-4 text-xs font-bold">CANCEL</button>
                        </div>
                    </div>`;
                document.body.insertAdjacentHTML('beforeend', modal);
            },
            filterSecs() {
                const yr = document.getElementById('s-year').value;
                const filtered = (App.collegeData.sections || []).filter(s => s.year === yr);
                document.getElementById('s-sec').innerHTML = filtered.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
            },
            proceedToStudentLogin() {
                const y = document.getElementById('s-year').value, s = document.getElementById('s-sec').value;
                if (!y || !s) return;
                const sectionId = `${y}-${s}`; document.getElementById('modal').remove();
                this.secureUserLogin('student_login', { y, s, sectionId });
            },
            secureUserLogin(role, context = null) {
                const isT = role === 'teacher_login';
                const id = prompt(isT ? "Professor Name:" : "Student Roll No:");
                if(!id) return;
                const safeId = id.replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
                const path = isT ? `teachers/${safeId}` : `students/${safeId}`;
                db.ref(`colleges/${App.college}/${path}`).once('value', snap => {
                    const user = snap.val();
                    if(!user) {
                        const pass = prompt("Account not found. Create a password to register:");
                        if(pass) { db.ref(`colleges/${App.college}/${path}`).set({ password: pass }); alert("Registration complete. Login again."); }
                    } else {
                        if(prompt("Enter Account Password:") === user.password) {
                            if(isT) { App.user = {name: id}; App.route('teacher'); }
                            else { App.user = { year: context.y, section: context.s, roll: id, sectionId: context.sectionId }; App.route('student'); }
                        } else alert("Invalid Password.");
                    }
                });
            },
            toggleAttendance(stdKey, classId) {
                if(App.collegeData.cancelled && App.collegeData.cancelled[classId]) return;
                const cur = App.collegeData.attendance && App.collegeData.attendance[stdKey] && App.collegeData.attendance[stdKey][classId];
                db.ref(`colleges/${App.college}/attendance/${stdKey}/${classId}`).set(!cur);
            },
            toggleCancel(id) {
                const cur = App.collegeData.cancelled && App.collegeData.cancelled[id];
                db.ref(`colleges/${App.college}/cancelled/${id}`).set(!cur);
            },
            updateCell(id, field, val) { db.ref(`colleges/${App.college}/schedule/${id}/${field}`).set(val); },
            addSection() {
                const y = prompt("Academic Year:"), n = prompt("Section Name:");
                if(y && n) {
                    const sects = App.collegeData.sections || [];
                    sects.push({ id: `${y}-${n}`.replace(/[.#$\[\]]/g, ''), year: y, name: n });
                    db.ref(`colleges/${App.college}/sections`).set(sects);
                }
            }
        };

        App.init();
    </script>
</body>
</html>
