<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniScheduler Pro | Multi-User Secure</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f8fafc; 
            color: #1e293b; 
        }
        .cancelled-class { 
            background-color: #fee2e2 !important; 
            color: #991b1b !important; 
            position: relative; 
            opacity: 0.7; 
        }
        .active-slot { 
            border: 2px solid #6366f1 !important; 
            animation: pulse 2s infinite; 
            background: #f5f3ff !important; 
        }
        @keyframes pulse { 
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 
            70% { box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } 
        }
        .scrollbar-hide::-webkit-scrollbar { 
            display: none; 
        }
    </style>
</head>
<body>

    <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="App.route('gatekeeper')">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <span class="text-white font-black">U</span>
                </div>
                <h1 class="text-xl font-extrabold tracking-tighter">UniScheduler <span class="text-indigo-600">Pro</span></h1>
            </div>
            <div id="nav-meta" class="hidden flex items-center gap-6">
                <div id="clock-display" class="font-bold text-sm hidden sm:block text-slate-500">00:00:00</div>
                <button onclick="Actions.logout()" class="bg-slate-100 hover:bg-red-50 text-slate-500 hover:text-red-600 p-2 rounded-lg transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" />
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main id="app" class="max-w-7xl mx-auto p-6"></main>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBazqqix_N0RwF35G1DjVkRgp3MV_QIstQ",
            authDomain: "attendance-sys-2812.firebaseapp.com",
            databaseURL: "https://attendance-sys-2812-default-rtdb.firebaseio.com",
            projectId: "attendance-sys-2812",
            storageBucket: "attendance-sys-2812.firebasestorage.app",
            messagingSenderId: "741925411402",
            appId: "1:741925411402:web:7a98b911ce5f57498c24b3"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CONFIG = {
            days: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'],
            slots: ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00']
        };

        const App = {
            college: localStorage.getItem('active_college'),
            collegeData: null,
            view: 'gatekeeper',
            user: JSON.parse(localStorage.getItem('active_user') || 'null'),
            activeSection: null,

            init() {
                if (this.college) { 
                    this.view = 'home'; 
                    this.sync(); 
                }
                
                setInterval(() => {
                    const el = document.getElementById('clock-display');
                    if (el) el.innerText = new Date().toLocaleTimeString();
                }, 1000);

                this.render();
            },

            sync() {
                db.ref('colleges/' + this.college).on('value', snap => {
                    this.collegeData = snap.val() || {};
                    this.render();
                });
            },

            route(v) { 
                this.view = v; 
                this.render(); 
            },

            render() {
                const root = document.getElementById('app');
                const nav = document.getElementById('nav-meta');
                
                if (this.college) nav.classList.remove('hidden');
                
                if (this.view === 'gatekeeper') { 
                    root.innerHTML = Views.gatekeeper(); 
                    return; 
                }

                if (!this.collegeData) { 
                    root.innerHTML = '<div class="mt-20 text-center animate-pulse text-slate-400 font-bold">Connecting to Campus Cloud...</div>'; 
                    return; 
                }
                
                switch(this.view) {
                    case 'home': root.innerHTML = Views.home(); break;
                    case 'admin': root.innerHTML = Views.admin(); break;
                    case 'teacher': root.innerHTML = Views.teacher(); break;
                    case 'student': root.innerHTML = Views.student(); break;
                }
            }
        };

        const Views = {
            gatekeeper: () => `
                <div class="max-w-md mx-auto mt-20 bg-white p-10 rounded-3xl shadow-2xl border border-slate-100">
                    <h2 class="text-3xl font-black mb-2 text-indigo-600">Institution Portal</h2>
                    <p class="text-slate-500 mb-8 font-medium text-sm italic">Enter institutional name to connect.</p>
                    
                    <input id="c-input" type="text" placeholder="College Name" 
                           class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl mb-4 focus:border-indigo-500 transition-all outline-none font-bold">
                    
                    <button onclick="Actions.enter()" 
                            class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all">
                        CONNECT
                    </button>
                    
                    <div class="relative my-8">
                        <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-100"></span></div>
                        <div class="relative flex justify-center text-xs uppercase">
                            <span class="bg-white px-2 text-slate-400 font-bold">Administration</span>
                        </div>
                    </div>
                    
                    <button onclick="Actions.registerCollege()" 
                            class="w-full border-2 border-slate-100 text-slate-600 py-3 rounded-2xl font-bold hover:bg-slate-50 transition-all">
                        REGISTER NEW COLLEGE
                    </button>
                </div>`,

            home: () => `
                <div class="grid md:grid-cols-3 gap-8 mt-12 max-w-5xl mx-auto">
                    ${Views.roleCard('Admin', '🛠️', 'Master Control', 'admin')}
                    ${Views.roleCard('Teacher', '👨‍🏫', 'Class Updates', 'teacher_login')}
                    ${Views.roleCard('Student', '🎓', 'Personal Portal', 'student_login')}
                </div>`,

            roleCard: (title, icon, sub, role) => `
                <div onclick="Actions.handleRole('${role}')" 
                     class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-xl hover:shadow-2xl transition-all cursor-pointer text-center group">
                    <div class="text-5xl mb-4 group-hover:scale-110 transition-transform">${icon}</div>
                    <h3 class="text-xl font-black">${title}</h3>
                    <p class="text-slate-400 font-bold text-[10px] mt-1 uppercase tracking-widest">${sub}</p>
                </div>`,

            teacher: () => `
                <div class="max-w-5xl mx-auto">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-3xl font-black">Hi, Prof. ${App.user.name}</h2>
                        <button onclick="App.route('home')" class="text-slate-400 font-bold hover:text-indigo-600 transition-colors">Back to Dashboard</button>
                    </div>
                    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
                        <div class="grid grid-cols-6 border-b text-[10px] font-black text-slate-400 bg-slate-50 uppercase p-4">
                            <div>Time</div>
                            ${CONFIG.days.map(d => `<div class="border-l pl-4">${d}</div>`).join('')}
                        </div>
                        ${CONFIG.slots.map(slot => `
                            <div class="grid grid-cols-6 border-b last:border-0 min-h-[100px]">
                                <div class="p-4 bg-slate-50/30 flex items-center font-bold text-slate-400 text-xs">${slot}</div>
                                ${CONFIG.days.map(day => {
                                    let matchId = null;
                                    let matchData = null;
                                    Object.keys(App.collegeData.schedule || {}).forEach(k => {
                                        if(App.collegeData.schedule[k].teacher === App.user.name && k.includes(`${day}-${slot}`)) {
                                            matchId = k; 
                                            matchData = App.collegeData.schedule[k];
                                        }
                                    });
                                    if(!matchId) return `<div class="border-l border-slate-50"></div>`;
                                    const isC = App.collegeData.cancelled && App.collegeData.cancelled[matchId];
                                    return `
                                        <div onclick="Actions.toggleCancel('${matchId}')" 
                                             class="p-4 border-l border-slate-50 cursor-pointer hover:bg-slate-50 ${isC ? 'cancelled-class' : ''}">
                                            <div class="text-[9px] font-black text-indigo-500 uppercase">${matchId.split('-')[0]}</div>
                                            <div class="font-bold text-sm">${matchData.subject}</div>
                                            <div class="text-[10px] mt-2 opacity-50 font-bold">${isC ? 'CANCELLED' : 'ACTIVE'}</div>
                                        </div>`;
                                }).join('')}
                            </div>
                        `).join('')}
                    </div>
                </div>`,

            student: () => {
                const today = CONFIG.days[new Date().getDay() - 1] || 'Monday';
                const studentKey = `${App.user.sectionId}_${App.user.roll}`.replace(/\s+/g, '_');
                const myAttendance = App.collegeData.attendance ? (App.collegeData.attendance[studentKey] || {}) : {};
                const presentCount = Object.values(myAttendance).filter(v => v === true).length;
                const totalScheduled = Object.keys(App.collegeData.schedule || {}).filter(k => 
                    k.startsWith(App.user.sectionId) && App.collegeData.schedule[k].subject !== ""
                ).length;

                const percentage = totalScheduled > 0 ? ((presentCount / totalScheduled) * 100).toFixed(1) : 0;
                const isLow = percentage < 75;

                return `
                <div class="max-w-7xl mx-auto">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                            <div class="text-[10px] font-black text-slate-400 uppercase">Identity</div>
                            <div class="text-xl font-black">${App.user.roll} <span class="text-indigo-600 text-xs">(${App.user.section})</span></div>
                        </div>
                        
                        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                            <div class="text-[10px] font-black text-slate-400 uppercase">Presence</div>
                            <div class="text-2xl font-black text-slate-800">${presentCount} / ${totalScheduled}</div>
                        </div>

                        <div class="${isLow ? 'bg-orange-500' : 'bg-emerald-500'} p-6 rounded-[2rem] text-white shadow-xl">
                            <div class="text-[10px] font-black opacity-70 uppercase">Attendance Rate</div>
                            <div class="flex items-end gap-2">
                                <div class="text-3xl font-black">${percentage}%</div>
                                <div class="text-[10px] font-bold mb-1 opacity-80">${isLow ? '⚠️ LOW' : '✓ GOOD'}</div>
                            </div>
                            <div class="w-full bg-white/20 h-1.5 rounded-full mt-3 overflow-hidden">
                                <div class="bg-white h-full" style="width: ${percentage}%"></div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm flex items-center justify-center">
                            <button onclick="Actions.logout()" class="text-slate-400 hover:text-red-500 font-bold text-xs transition-colors">LOGOUT PORTAL</button>
                        </div>
                    </div>

                    <div class="bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 overflow-hidden">
                        <div class="overflow-x-auto scrollbar-hide">
                            <table class="w-full">
                                <thead class="bg-slate-900 text-white">
                                    <tr>
                                        <th class="p-6 text-left text-[10px] font-black uppercase opacity-40">Hour</th>
                                        ${CONFIG.days.map(day => `<th class="p-6 font-bold text-sm ${day === today ? 'bg-indigo-600' : ''}">${day}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${CONFIG.slots.map(slot => `
                                        <tr class="border-b border-slate-50 last:border-0">
                                            <td class="p-6 font-bold text-slate-400 text-xs bg-slate-50/50">${slot}</td>
                                            ${CONFIG.days.map(day => {
                                                const id = `${App.user.sectionId}-${day}-${slot}`.replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
                                                const cell = App.collegeData.schedule && App.collegeData.schedule[id];
                                                const isC = App.collegeData.cancelled && App.collegeData.cancelled[id];
                                                const isPresent = myAttendance[id];
                                                
                                                if(!cell || !cell.subject) return `<td class="p-2 border-l border-slate-50"></td>`;
                                                
                                                return `
                                                    <td class="p-2 border-l border-slate-100 min-w-[180px]">
                                                        <div onclick="Actions.toggleAttendance('${studentKey}', '${id}')" 
                                                             class="p-5 rounded-3xl transition-all cursor-pointer ${isC ? 'cancelled-class' : (isPresent ? 'bg-emerald-50 border-2 border-emerald-500 shadow-lg shadow-emerald-100/50' : 'bg-white border-2 border-transparent hover:border-slate-100')}">
                                                            <div class="text-[9px] font-black ${isPresent ? 'text-emerald-600' : 'text-slate-400'} uppercase mb-1">
                                                                ${isC ? 'CLASS CANCELLED' : (isPresent ? '✓ RECORDED' : 'MARK ATTENDANCE')}
                                                            </div>
                                                            <div class="font-black text-slate-800 text-lg leading-tight">${cell.subject}</div>
                                                            <div class="text-[11px] text-slate-400 font-bold mt-2">${cell.teacher}</div>
                                                        </div>
                                                    </td>`;
                                            }).join('')}
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            },

            admin: () => `
                <div class="flex flex-col lg:flex-row gap-8">
                    <div class="w-full lg:w-72 shrink-0">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-xl font-black">Sections</h2>
                            <button onclick="Actions.addSection()" class="bg-indigo-600 text-white w-8 h-8 rounded-lg shadow-md hover:bg-indigo-700">+</button>
                        </div>
                        <div class="space-y-3">
                            ${(App.collegeData.sections || []).map(s => `
                                <div onclick="App.activeSection='${s.id}'; App.render()" 
                                     class="p-4 rounded-2xl border-2 transition-all cursor-pointer ${App.activeSection === s.id ? 'bg-indigo-600 border-indigo-600 text-white shadow-lg shadow-indigo-100' : 'bg-white border-transparent hover:border-slate-200'}">
                                    <div class="font-bold">${s.name} <span class="text-[10px] opacity-60">(${s.year})</span></div>
                                </div>`).join('')}
                        </div>
                    </div>
                    <div class="grow bg-white rounded-3xl shadow-xl border border-slate-100 p-6 overflow-hidden">
                        ${App.activeSection ? Views.editorTable() : `<div class="p-20 text-center text-slate-300 italic font-medium">Select a section from the left to edit schedule.</div>`}
                    </div>
                </div>`,

            editorTable: () => `
                <div class="overflow-x-auto scrollbar-hide">
                    <table class="w-full">
                        <thead>
                            <tr>
                                <th></th>
                                ${CONFIG.slots.map(s => `<th class="p-2 text-[10px] font-black text-slate-400 uppercase">${s}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${CONFIG.days.map(day => `
                                <tr class="border-t border-slate-50">
                                    <td class="p-3 font-black text-xs text-slate-400">${day.slice(0,3)}</td>
                                    ${CONFIG.slots.map(slot => {
                                        const id = `${App.activeSection}-${day}-${slot}`.replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
                                        const cell = (App.collegeData.schedule && App.collegeData.schedule[id]) || {subject:'', teacher:''};
                                        return `
                                            <td>
                                                <div class="bg-slate-50 p-2 m-1 rounded-xl min-w-[110px] border border-transparent focus-within:border-indigo-200 transition-all">
                                                    <input onchange="Actions.updateCell('${id}', 'subject', this.value)" value="${cell.subject}" 
                                                           placeholder="Subject" class="w-full bg-transparent text-xs font-bold outline-none">
                                                    <input onchange="Actions.updateCell('${id}', 'teacher', this.value)" value="${cell.teacher}" 
                                                           placeholder="Teacher" class="w-full bg-transparent text-[9px] text-slate-400 outline-none">
                                                </div>
                                            </td>`;
                                    }).join('')}
                                </tr>`).join('')}
                        </tbody>
                    </table>
                </div>`
        };

        const Actions = {
            enter() {
                const n = document.getElementById('c-input').value;
                if (!n) return;
                db.ref('colleges/' + n).once('value', s => {
                    if (s.exists()) { 
                        App.college = n; 
                        localStorage.setItem('active_college', n); 
                        App.sync(); 
                        App.route('home'); 
                    } else {
                        alert("College not registered in our records.");
                    }
                });
            },

            registerCollege() {
                const n = prompt("Enter New Institution Name:");
                const p = prompt("Set Admin Master Password:");
                if (n && p) {
                    db.ref('colleges/'+n).set({ 
                        password: p, 
                        sections: [], 
                        schedule: {} 
                    }).then(() => alert("Institution created! You can now Connect using the college name."));
                }
            },

            handleRole(role) {
                if (role === 'admin') {
                    if (prompt("Admin Password:") === App.collegeData.password) {
                        App.route('admin');
                    } else {
                        alert("Access Denied.");
                    }
                } else {
                    this.secureUserLogin(role);
                }
            },

            secureUserLogin(role) {
                const isTeacher = role === 'teacher_login';
                const id = prompt(isTeacher ? "Enter Teacher Name:" : "Enter Roll No:");
                if (!id) return;

                const safeId = id.replace(/\s+/g, '_').replace(/[.#$\[\]]/g, '');
                const path = isTeacher ? `teachers/${safeId}` : `students/${safeId}`;

                db.ref(`colleges/${App.college}/${path}`).once('value', snap => {
                    const user = snap.val();
                    if (!user) {
                        const pass = prompt("First-time login. Please create a password:");
                        if (pass) {
                            db.ref(`colleges/${App.college}/${path}`).set({ password: pass });
                            alert("Registration successful! Please login again with your new password.");
                        }
                    } else {
                        if (prompt("Enter your Password:") === user.password) {
                            if (isTeacher) { 
                                App.user = { name: id }; 
                                App.route('teacher'); 
                            } else { 
                                this.showStudentSelect(id); 
                            }
                        } else {
                            alert("Invalid Credentials.");
                        }
                    }
                });
            },

            showStudentSelect(roll) {
                const years = [...new Set((App.collegeData.sections || []).map(s => s.year))];
                const modal = `
                    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur z-[100] flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
                            <h3 class="text-xl font-black mb-4">Identify Section</h3>
                            <select id="s-year" class="w-full bg-slate-50 border-2 p-4 rounded-xl font-bold mb-4 outline-none focus:border-indigo-500" onchange="Actions.filterSecs()">
                                <option value="">Select Year</option>
                                ${years.map(y => `<option value="${y}">${y}</option>`).join('')}
                            </select>
                            <select id="s-sec" class="w-full bg-slate-50 border-2 p-4 rounded-xl font-bold mb-6 outline-none focus:border-indigo-500">
                                <option value="">Select Section</option>
                            </select>
                            <button onclick="Actions.setStudent('${roll}')" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">ENTER PORTAL</button>
                        </div>
                    </div>`;
                document.body.insertAdjacentHTML('beforeend', modal);
            },

            filterSecs() {
                const yr = document.getElementById('s-year').value;
                const filtered = (App.collegeData.sections || []).filter(s => s.year === yr);
                document.getElementById('s-sec').innerHTML = filtered.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
            },

            setStudent(roll) {
                const y = document.getElementById('s-year').value;
                const s = document.getElementById('s-sec').value;
                if (!y || !s) return;
                App.user = { year: y, section: s, roll: roll, sectionId: `${y}-${s}` };
                localStorage.setItem('active_user', JSON.stringify(App.user));
                document.getElementById('modal').remove(); 
                App.route('student');
            },

            toggleAttendance(stdKey, classId) {
                const cur = App.collegeData.attendance && App.collegeData.attendance[stdKey] && App.collegeData.attendance[stdKey][classId];
                db.ref(`colleges/${App.college}/attendance/${stdKey}/${classId}`).set(!cur);
            },

            toggleCancel(id) {
                const cur = App.collegeData.cancelled && App.collegeData.cancelled[id];
                db.ref(`colleges/${App.college}/cancelled/${id}`).set(!cur);
            },

            updateCell(id, field, val) { 
                db.ref(`colleges/${App.college}/schedule/${id}/${field}`).set(val); 
            },

            addSection() {
                const y = prompt("Year (e.g. 1st Year):");
                const n = prompt("Section (e.g. Section A):");
                if (y && n) {
                    const sects = App.collegeData.sections || [];
                    sects.push({ id: `${y}-${n}`.replace(/[.#$\[\]]/g, ''), year: y, name: n });
                    db.ref(`colleges/${App.college}/sections`).set(sects);
                }
            },

            logout() { 
                localStorage.clear(); 
                location.reload(); 
            }
        };

        // Launch App
        App.init();
    </script>
</body>
</html>
